version: 1
appendOnly: true
labels:
  - label: 'dependencies'
    type: 'pull_request'
    authors:
      - 'dependabot[bot]'
  - label: 'bugfix'
    title: '(?i).*fix.*'
  - label: 'bugfix'
    branch: '(?i).*fix.*'
  - label: 'feature'
    title: '(?i).*feat.*'
  - label: 'feature'
    branch: '(?i).*feat.*'
  - label: 'breaking-change'
    title: '(?i).*breaking[ -_]change.*'
  - label: 'breaking-change'
    branch: '(?i).*breaking[ -_]change.*'
  - label: 'github-workflows'
    title: '(?i).*(github[ -_]?actions?|workflows?).*'
  - label: 'github-workflows'
    branch: '(?i).*(github[ -_]?actions?|workflows?).*'
  - label: 'enhancement'
    title: '(?i).*enhance.*'
  - label: 'enhancement'
    branch: '(?i).*enhance.*'
  - label: 'enhancement'
    title: '(?i).*improve.*'
  - label: 'enhancement'
    branch: '(?i).*improve.*'
  - label: 'documentation'
    title: '(?i).*(docs|document).*'
  - label: 'documentation'
    branch: '(?i).*(docs|document).*'
  - label: 'documentation'
    title: '(?i).*readme.*'
  - label: 'documentation'
    branch: '(?i).*readme.*'
  - label: 'code-quality'
    title: '(?i).*lint.*'
  - label: 'code-quality'
    title: '(?i).*ruff.*'
  - label: 'code-quality'
    title: '(?i).*mypy.*'
  - label: 'code-quality'
    title: '(?i).*pytest.*'
  - label: 'code-quality'
    title: '(?i).*coverage.*'
  - label: 'code-quality'
    title: '(?i).*type-?check.*'
  - label: 'code-quality'
    title: '(?i).*pre[ -_]?commit.*'
