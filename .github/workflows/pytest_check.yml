name: pytest check and post coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pull-request-tests:
    name: pytest check and post coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout trusted dependency authorization helper
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}


      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true

      - name: Run pytest with coverage (pytest-cov)
        run: uv run --locked --group pytest pytest

      - name: Generate PR coverage comment artifact
        if: github.event_name == 'pull_request'
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: process_pr
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Store PR Comment to be Posted
        if: steps.coverage_comment.outputs.comment_file_written == 'true'
        uses: actions/upload-artifact@v7
        with:
          # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
          name: python-coverage-comment-action
          # If you use a different name, update COMMENT_FILENAME accordingly
          path: python-coverage-comment-action.txt
          retention-days: 1

      - name: Store default branch coverage data
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-data
          path: .coverage
          include-hidden-files: true
          retention-days: 1
