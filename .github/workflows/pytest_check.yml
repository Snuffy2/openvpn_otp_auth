name: pytest check and post coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  pull-request-tests:
    name: pytest check and post coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python 3 (with caching)
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install pytest Requirements
        run: |
          python -m pip install --upgrade pip
          pip install --group pytest -e .

      - name: Run pytest with coverage (pytest-cov)
        run: pytest

      - name: 'Generate coverage Comment (and possibly Post to PR)'
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: ${{ github.event_name == 'push' && 'save_coverage_data_files' || 'process_pr' }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Store PR Comment to be Posted
        if: ${{ github.event_name != 'workflow_dispatch' && steps.coverage_comment.outputs.comment_file_written == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
          name: python-coverage-comment-action
          # If you use a different name, update COMMENT_FILENAME accordingly
          path: python-coverage-comment-action.txt
          retention-days: 1
