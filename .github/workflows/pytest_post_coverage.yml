name: pytest post coverage

on:
  workflow_run:
    workflows: ['pytest check and post coverage']
    types:
      - completed

jobs:
  publish-coverage-data:
    name: save default branch coverage data
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout exact source workflow revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download source workflow coverage data
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: python-coverage-data
          path: .
          run-id: ${{ github.event.workflow_run.id }}

      - name: Save coverage data
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: save_coverage_data_files
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

  post-coverage-comment:
    name: pytest post coverage
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      # DO NOT run actions/checkout here, for security reasons.
      # For details, refer to https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      - name: Post coverage Comment to PR
        uses: py-cov-action/python-coverage-comment-action@v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIVITY: post_comment
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
