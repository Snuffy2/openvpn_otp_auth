name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Build and test immutable release candidate
    if: github.event.repository.fork == false && github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout immutable release event commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prepare the release version in the isolated candidate
        env:
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/verify_release_candidate.py prepare-version --release-tag "$RELEASE_TAG"
      - name: Test and build the candidate package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build twine
          mkdir -p release-candidate/dist
          cp src/openvpn_otp_auth/_version.py release-candidate/_version.py
          python -m build --outdir release-candidate/dist
          twine check release-candidate/dist/*
      - name: Store the bounded candidate handoff
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: |
            release-candidate/_version.py
            release-candidate/dist/*.tar.gz
            release-candidate/dist/*.whl
          if-no-files-found: error
          retention-days: 30

  validate_prerelease:
    name: Validate prerelease candidate
    needs: candidate
    if: github.event.repository.fork == false && github.event.release.prerelease == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the default-branch release target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TARGET" == "$DEFAULT_BRANCH" ]]
      - name: Checkout trusted default-branch workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove the prerelease tag is already a matching default-branch commit
        id: state
        env:
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/heads/$RELEASE_TARGET:refs/remotes/origin/$RELEASE_TARGET" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/remotes/origin/$RELEASE_TARGET")" ]]
          state="$(python .github/scripts/release_refs.py validate \
            --release-tag "$RELEASE_TAG" \
            --target-ref "refs/remotes/origin/$RELEASE_TARGET" \
            --prerelease true \
            --event-sha "$RELEASE_EVENT_SHA")"
          printf '%s\n' "$state" >> "$GITHUB_OUTPUT"
          source_sha="$(awk -F= '$1 == "source-sha" { print $2 }' <<< "$state")"
          [[ -n "$source_sha" ]]
          [[ "$source_sha" == "$RELEASE_EVENT_SHA" ]]
          git checkout --detach "$source_sha"
      - name: Download the untrusted candidate handoff
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: downloaded-candidate
      - name: Verify the prerelease candidate handoff
        env:
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python .github/scripts/verify_release_candidate.py verify \
            --candidate-directory downloaded-candidate \
            --output-directory verified-candidate \
            --release-tag "$RELEASE_TAG"

  promote_stable:
    name: Validate and atomically promote stable candidate
    needs: candidate
    if: github.event.repository.fork == false && github.event.release.prerelease == false
    outputs:
      candidate-sha: ${{ steps.candidate.outputs.sha }}
      validation-ref: ${{ steps.validation_ref.outputs.name }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      statuses: write
    env:
      REQUIRED_CHECKS: |
        prek-autofix-review.yml::review
        pytest_check.yml::pytest check and post coverage
    steps:
      - name: Require the default-branch release target
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TARGET" == "$DEFAULT_BRANCH" ]]
      - name: Checkout trusted default-branch workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable starting refs or an exact resume candidate
        id: state
        env:
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/heads/$RELEASE_TARGET:refs/remotes/origin/$RELEASE_TARGET" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/remotes/origin/$RELEASE_TARGET")" ]]
          state="$(python .github/scripts/release_refs.py validate \
            --release-tag "$RELEASE_TAG" \
            --target-ref "refs/remotes/origin/$RELEASE_TARGET" \
            --prerelease false \
            --event-sha "$RELEASE_EVENT_SHA")"
          printf '%s\n' "$state" >> "$GITHUB_OUTPUT"
          source_sha="$(awk -F= '$1 == "source-sha" { print $2 }' <<< "$state")"
          [[ -n "$source_sha" ]]
          echo "workflow-sha=$source_sha" >> "$GITHUB_OUTPUT"
          mode="$(awk -F= '$1 == "mode" { print $2 }' <<< "$state")"
          if [[ "$mode" == fresh ]]; then
            [[ "$source_sha" == "$RELEASE_EVENT_SHA" ]]
          fi
          git checkout --detach "$source_sha"
      - name: Download the untrusted candidate handoff
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: downloaded-candidate
      - name: Verify and reconstruct only the candidate package identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python .github/scripts/verify_release_candidate.py verify \
            --candidate-directory downloaded-candidate \
            --output-directory verified-candidate \
            --release-tag "$RELEASE_TAG"
      - name: Create or reuse the deterministic release commit
        id: candidate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_MODE: ${{ steps.state.outputs.mode }}
          RESUME_SHA: ${{ steps.state.outputs['candidate-sha'] }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == resume ]]; then
            cmp verified-candidate/_version.py src/openvpn_otp_auth/_version.py
            echo "sha=$RESUME_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp verified-candidate/_version.py src/openvpn_otp_auth/_version.py
          git add src/openvpn_otp_auth/_version.py
          git diff --cached --check
          git diff --cached --name-only -z | {
            IFS= read -r -d '' staged_path
            [[ "$staged_path" == src/openvpn_otp_auth/_version.py ]]
            if IFS= read -r -d ''; then
              exit 1
            fi
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release $RELEASE_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish candidate to an isolated validation branch
        id: validation_ref
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          temp_ref="release-validation/${RELEASE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git check-ref-format --branch "$temp_ref"
          gh auth setup-git --hostname github.com
          git push origin "$CANDIDATE_SHA:refs/heads/$temp_ref"
          echo "name=$temp_ref" >> "$GITHUB_OUTPUT"
      - name: Dispatch and verify immutable release gates
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          WORKFLOW_REF: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ steps.state.outputs['workflow-sha'] }}
        run: |
          set -euo pipefail
          required_check_args=()
          while IFS= read -r required_check; do
            [[ -z "$required_check" ]] || required_check_args+=(--required-check "$required_check")
          done <<< "$REQUIRED_CHECKS"
          python .github/scripts/verify_release_checks.py \
            --repository "$GITHUB_REPOSITORY" --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" --sha "$CANDIDATE_SHA" \
            "${required_check_args[@]}"
      - name: Atomically advance default branch and annotated release tag
        if: steps.state.outputs.mode == 'fresh'
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_TAG_OID: ${{ steps.state.outputs['tag-oid'] }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.repository.default_branch }}
          TARGET_SHA: ${{ steps.state.outputs['target-sha'] }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/heads/$RELEASE_TARGET:refs/remotes/origin/$RELEASE_TARGET" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          gh auth setup-git --hostname github.com
          python .github/scripts/release_refs.py promote \
            --target-branch "$RELEASE_TARGET" \
            --expected-target-sha "$TARGET_SHA" \
            --release-tag "$RELEASE_TAG" \
            --expected-tag-oid "$ORIGINAL_TAG_OID" \
            --candidate-sha "$CANDIDATE_SHA"
      - name: Verify final stable release identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin \
            "refs/heads/$RELEASE_TARGET:refs/remotes/origin/$RELEASE_TARGET" \
            "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          state="$(python .github/scripts/release_refs.py validate \
            --release-tag "$RELEASE_TAG" \
            --target-ref "refs/remotes/origin/$RELEASE_TARGET" \
            --prerelease false \
            --event-sha "$RELEASE_EVENT_SHA")"
          grep -Fx "candidate-sha=$CANDIDATE_SHA" <<< "$state"
      - name: Store only the verified distributions for PyPI
        uses: actions/upload-artifact@v7
        with:
          name: verified-python-distributions
          path: verified-candidate/dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified stable distribution to PyPI
    needs: promote_stable
    if: github.event.repository.fork == false && needs.promote_stable.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the verified candidate distributions
        uses: actions/download-artifact@v8
        with:
          name: verified-python-distributions
          path: dist/
      - name: Publish the verified distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  cleanup_validation_ref:
    name: Delete validated release branch
    needs: [promote_stable, publish]
    if: github.event.repository.fork == false && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted default-branch workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Delete the verified temporary branch
        env:
          CANDIDATE_SHA: ${{ needs.promote_stable.outputs.candidate-sha }}
          GH_TOKEN: ${{ github.token }}
          TEMP_REF: ${{ needs.promote_stable.outputs.validation-ref }}
        run: |
          set -euo pipefail
          [[ -n "$TEMP_REF" ]]
          git fetch --no-tags origin "refs/heads/$TEMP_REF:refs/remotes/origin/$TEMP_REF"
          [[ "$(git rev-parse "refs/remotes/origin/$TEMP_REF")" == "$CANDIDATE_SHA" ]]
          gh auth setup-git --hostname github.com
          git push --force-with-lease="refs/heads/$TEMP_REF:$CANDIDATE_SHA" \
            origin --delete "$TEMP_REF"

  publish_testpypi:
    name: Publish package to TestPyPI
    if: github.event.repository.fork == false && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout manually selected source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build the manually selected package
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Publish package to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
          skip-existing: true
